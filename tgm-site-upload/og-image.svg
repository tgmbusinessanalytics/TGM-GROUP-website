<!-- Source artwork for the Open Graph / Twitter card image.

     THIS FILE IS NOT SERVED TO SOCIAL PLATFORMS. Facebook, LinkedIn, X and
     WhatsApp do not render SVG previews. Export this to PNG at exactly
     1200x630 and save it as public/og.png, which is what Base.astro points at.

     Any of these will do it:
       - Open in a browser at 1200x630 and screenshot
       - Inkscape: inkscape og-image.svg -w 1200 -h 630 -o og.png
       - rsvg-convert -w 1200 -h 630 og-image.svg -o og.png

     The type here is Archivo. If Archivo is not installed on the exporting
     machine it will fall back and the export will be wrong — install it first,
     or export on a machine that has it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#16202E"/>

  <!-- The motif, cropped, on the right third. Same four bars, same ascent. -->
  <g transform="translate(760, 630)">
    <rect x="0"   y="-150" width="70" height="150" fill="#4A5C78"/>
    <rect x="90"  y="-224" width="70" height="224" fill="#177E6E"/>
    <rect x="180" y="-297" width="70" height="297" fill="#35A891"/>
    <rect x="270" y="-384" width="70" height="384" fill="#F0BC20"/>
    <!-- Gridlines, in the page background rather than white, so they read as
         cuts through the bars on the dark ground. -->
    <rect x="0" y="-77"  width="340" height="2" fill="#16202E"/>
    <rect x="0" y="-179" width="340" height="2" fill="#16202E"/>
    <rect x="0" y="-281" width="340" height="2" fill="#16202E"/>
  </g>

  <!-- Gold rule above the wordmark, as on the hero. -->
  <rect x="80" y="150" width="72" height="6" fill="#F0BC20"/>

  <text x="80" y="220"
        font-family="Archivo, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="0.9" fill="#FFFFFF">TGM GROUP</text>

  <text font-family="Archivo, 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">
    <tspan x="80" y="330">Build the structure</tspan>
    <tspan x="80" y="398">your growth is</tspan>
    <tspan x="80" y="466">standing on</tspan>
  </text>

  <text x="80" y="536"
        font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif"
        font-size="24" fill="#9AA8BC">South African business transformation partner</text>
</svg>
